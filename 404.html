<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERR404</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }
        .box {
            max-width: 640px;
            width: 100%;
        }
        .code {
            font-size: 0.9rem;
            color: #f85149;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
        }
        p {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .url {
            font-size: 0.85rem;
            color: #6e7681;
            word-break: break-all;
            margin-bottom: 1.75rem;
        }
        a.btn {
            display: inline-block;
            padding: 0.65rem 1.4rem;
            background-color: #21262d;
            color: #e6edf3;
            text-decoration: none;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        a.btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">ERR 404 • NOT_FOUND</div>
        <h1>Invalid URL</h1>
        <p>The address you requested could not be resolved on this host.</p>
        <div class="url" id="req-url"></div>
        <a href="https://farismuhd.dev" class="btn">Go to Main page</a>
    </div>
    <script>
        document.getElementById("req-url").textContent = window.location.href;
    </script>
</body>
</html>
